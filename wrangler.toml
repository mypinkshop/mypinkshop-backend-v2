name = "myjinkshop"
main = "src/index.js"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "myjinkshop-db"
database_id = "REPLACE_WITH_YOUR_ID"

# JWT_SECRET must be set as a secret, not committed here. Run:
#   wrangler secret put JWT_SECRET
#
# Any non-secret config vars can go here, e.g.:
# [vars]
# ENVIRONMENT = "production"
